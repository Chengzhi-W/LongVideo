generator_ckpt: checkpoints/chunkwise/ar_diffusion.pt
generator_fsdp_wrap_strategy: size
text_encoder_fsdp_wrap_strategy: size

num_train_timestep: 1000
timestep_shift: 5.0
guidance_scale: 3.0
denoising_loss_type: flow
mixed_precision: true
seed: 42

wandb_host: https://api.wandb.ai
wandb_entity: null
wandb_project: long-video-ar-teacher-20s-smoke

sharding_strategy: no_shard
batch_size: 1
# Exercise the same two-micro-step accumulation used by the 8-GPU launcher.
gradient_accumulation_steps: 2
total_batch_size: 2
num_workers: 0
lr: 2.0e-06
beta1: 0.0
beta2: 0.999
ema_weight: 0.0
ema_start_step: 2000000000

max_steps: 2
save_steps: [1, 2]
log_iters: 1

negative_prompt: '色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走'

# Full 81-frame temporal path at half spatial resolution for one-GPU debugging.
image_or_video_shape: [1, 81, 16, 30, 52]
trainer: diffusion
gradient_checkpointing: true
num_frame_per_block: 3
num_training_frames: 81
load_raw_video: false
teacher_forcing: true
noise_augmentation_max_timestep: 0
sparse_target_num_blocks: 12
sparse_target_num_patterns: 9
sparse_target_pattern_stride: 2

model_kwargs:
  timestep_shift: 5.0
  local_attn_size: 21
  sink_size: 3
  slow_context_size: 12
  fast_context_size: 3
  slow_context_stride_blocks: 2
  max_num_frames: 81
  frame_seq_length: 390

data_path: dataset/UltraVideo-Long-debug/clean_data_81_240x416
